name: heartbeat

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run-heartbeat
        env:
          XTUIS_TOKEN: ${{ secrets.XTUIS_TOKEN }}
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python3 src/airdrop_monitor.py --heartbeat
